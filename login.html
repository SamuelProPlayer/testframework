<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login - Área do Corretor SA Central de Vendas">
    <title>Login - SA Central de Vendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom-grid.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="logo.png">
</head>
<body>
    <!-- Navegação -->
    <nav class="nav">
        <div id="logo">
            <a href="index.html"><img src="logo.png" alt="Logo SA Central" height="60"></a>
        </div>
        <div class="btn-nav">
            <a href="index.html"><button>Home</button></a>
            <a href="index.html#contato"><button>Contato</button></a>
        </div>
    </nav>

    <!-- Container de Login -->
    <div class="login-container">
        <section class="login-box">
            <h2>Área do Corretor</h2>
            <form id="form-login" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="seu@email.com"
                        aria-label="Email do corretor"
                    >
                    <small class="error-message" id="error-email"></small>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        name="senha" 
                        required 
                        placeholder="Sua senha"
                        aria-label="Senha do corretor"
                    >
                    <small class="error-message" id="error-senha"></small>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
            <div class="login-footer">
                <p>Não tem acesso? <a href="#">Solicite ao administrador</a></p>
                <p><a href="index.html">Voltar para Home</a></p>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer" style="position: fixed; bottom: 0; width: 100%;">
        <div class="footer-content">
            <p>&copy; 2026 SA Incorporadora. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/modules/validacao.js"></script>
    <script src="js/modules/api.js"></script>
    <script>
        // Login Form Handler
        $(document).ready(function() {
            $('#form-login').on('submit', function(e) {
                e.preventDefault();
                
                const email = $('#email').val().trim();
                const senha = $('#senha').val();
                
                // Validações
                let valid = true;
                
                if (!Validacao.validarEmail(email)) {
                    $('#error-email').text('Email inválido').show();
                    valid = false;
                } else {
                    $('#error-email').hide();
                }
                
                if (senha.length < 6) {
                    $('#error-senha').text('Senha deve ter pelo menos 6 caracteres').show();
                    valid = false;
                } else {
                    $('#error-senha').hide();
                }
                
                if (!valid) return;
                
                // Simular autenticação
                if (email === 'corretor@savendas.com' && senha === '123456') {
                    localStorage.setItem('corretor-autenticado', JSON.stringify({
                        email: email,
                        nome: 'João Silva',
                        autenticadoEm: new Date().toISOString()
                    }));
                    alert('Login realizado com sucesso!');
                    window.location.href = 'cadastro-imovel.html';
                } else {
                    alert('Email ou senha inválidos!');
                }
            });
        });
    </script>
</body>
</html>
