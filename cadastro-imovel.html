<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro de Imóveis - SA Central de Vendas">
    <title>Cadastro de Imóvel - SA Central de Vendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom-grid.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="logo.png">
</head>
<body>
    <!-- Navegação -->
    <nav class="nav">
        <div id="logo">
            <a href="index.html"><img src="logo.png" alt="Logo SA Central" height="60"></a>
        </div>
        <div class="btn-nav">
            <a href="index.html"><button>Home</button></a>
            <a href="index.html#contato"><button>Contato</button></a>
            <a href="login.html"><button id="btn-add">Área do Corretor</button></a>
        </div>
    </nav>

    <!-- Container de Cadastro -->
    <div class="cadastro-container">
        <section class="cadastro-box">
            <h2>Cadastrar Novo Imóvel</h2>
            <form id="form-cadastro" novalidate>
                
                <!-- INFORMAÇÕES BÁSICAS -->
                <fieldset>
                    <legend style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; color: #1a1a1a;">Informações Básicas</legend>
                    
                    <div class="cadastro-grid">
                        <div class="form-group">
                            <label for="nome">Nome do Imóvel</label>
                            <input 
                                type="text" 
                                id="nome" 
                                name="nome" 
                                required 
                                placeholder="Ex: Mansão Riviera"
                                aria-label="Nome do imóvel"
                            >
                        </div>
                        <div class="form-group">
                            <label for="tipo">Tipo de Imóvel</label>
                            <select id="tipo" name="tipo" required aria-label="Tipo de imóvel">
                                <option value="">Selecione um tipo</option>
                                <option value="casa">Casa</option>
                                <option value="apartamento">Apartamento</option>
                                <option value="sobrado">Sobrado</option>
                                <option value="chacara">Chácara</option>
                                <option value="lote">Lote</option>
                            </select>
                        </div>
                    </div>

                    <div class="cadastro-grid">
                        <div class="form-group">
                            <label for="preco">Preço (R$)</label>
                            <input 
                                type="number" 
                                id="preco" 
                                name="preco" 
                                required 
                                placeholder="0.00"
                                min="0"
                                step="100000"
                                aria-label="Preço do imóvel"
                            >
                        </div>
                        <div class="form-group">
                            <label for="finalidade">Finalidade</label>
                            <select id="finalidade" name="finalidade" required aria-label="Finalidade">
                                <option value="">Selecione</option>
                                <option value="venda">Venda</option>
                                <option value="aluguel">Aluguel</option>
                                <option value="ambas">Ambas</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <!-- CARACTERÍSTICAS -->
                <fieldset style="margin-top: 2.5rem;">
                    <legend style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; color: #1a1a1a;">Características</legend>
                    
                    <div class="cadastro-grid">
                        <div class="form-group">
                            <label for="suites">Suítes</label>
                            <input 
                                type="number" 
                                id="suites" 
                                name="suites" 
                                required 
                                min="0"
                                value="0"
                                aria-label="Número de suítes"
                            >
                        </div>
                        <div class="form-group">
                            <label for="banheiros">Banheiros</label>
                            <input 
                                type="number" 
                                id="banheiros" 
                                name="banheiros" 
                                required 
                                min="0"
                                value="0"
                                aria-label="Número de banheiros"
                            >
                        </div>
                    </div>

                    <div class="cadastro-grid">
                        <div class="form-group">
                            <label for="area">Área (m²)</label>
                            <input 
                                type="number" 
                                id="area" 
                                name="area" 
                                required 
                                min="0"
                                placeholder="0"
                                aria-label="Área em metros quadrados"
                            >
                        </div>
                        <div class="form-group">
                            <label for="garagens">Garagens</label>
                            <input 
                                type="number" 
                                id="garagens" 
                                name="garagens" 
                                min="0"
                                value="0"
                                aria-label="Número de garagens"
                            >
                        </div>
                    </div>
                </fieldset>

                <!-- LOCALIZAÇÃO -->
                <fieldset style="margin-top: 2.5rem;">
                    <legend style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; color: #1a1a1a;">Localização</legend>
                    
                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <input 
                            type="text" 
                            id="cep" 
                            name="cep" 
                            placeholder="00000-000"
                            aria-label="CEP"
                        >
                        <small id="cep-error" style="color: #d32f2f; display: none;"></small>
                    </div>

                    <div class="cadastro-grid">
                        <div class="form-group">
                            <label for="endereco">Endereço</label>
                            <input 
                                type="text" 
                                id="endereco" 
                                name="endereco" 
                                required 
                                placeholder="Rua, Avenida, etc"
                                aria-label="Endereço"
                            >
                        </div>
                        <div class="form-group">
                            <label for="bairro">Bairro</label>
                            <input 
                                type="text" 
                                id="bairro" 
                                name="bairro" 
                                required 
                                placeholder="Bairro"
                                aria-label="Bairro"
                            >
                        </div>
                    </div>

                    <div class="cadastro-grid">
                        <div class="form-group">
                            <label for="cidade">Cidade</label>
                            <input 
                                type="text" 
                                id="cidade" 
                                name="cidade" 
                                required 
                                placeholder="Cidade"
                                aria-label="Cidade"
                            >
                        </div>
                        <div class="form-group">
                            <label for="estado">Estado</label>
                            <input 
                                type="text" 
                                id="estado" 
                                name="estado" 
                                placeholder="SP"
                                maxlength="2"
                                aria-label="Estado"
                            >
                        </div>
                    </div>
                </fieldset>

                <!-- DESCRIÇÃO -->
                <fieldset style="margin-top: 2.5rem;">
                    <legend style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; color: #1a1a1a;">Descrição</legend>
                    
                    <div class="form-group">
                        <label for="descricao">Descrição Breve</label>
                        <textarea 
                            id="descricao" 
                            name="descricao" 
                            rows="3" 
                            placeholder="Uma breve descrição do imóvel"
                            aria-label="Descrição breve"
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="descricaoCompleta">Descrição Completa</label>
                        <textarea 
                            id="descricaoCompleta" 
                            name="descricaoCompleta" 
                            rows="5" 
                            placeholder="Descrição detalhada com características especiais"
                            aria-label="Descrição completa"
                        ></textarea>
                    </div>
                </fieldset>

                <!-- ATRIBUTOS -->
                <fieldset style="margin-top: 2.5rem;">
                    <legend style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; color: #1a1a1a;">Atributos do Imóvel</legend>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="atributos" value="Ar Condicionado">
                            Ar Condicionado
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="atributos" value="Piscina">
                            Piscina
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="atributos" value="Sauna">
                            Sauna
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="atributos" value="Churrasqueira">
                            Churrasqueira
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="atributos" value="Cinema">
                            Cinema
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="atributos" value="Gym">
                            Academia/Gym
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="atributos" value="Hidromassagem">
                            Hidromassagem
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="atributos" value="Automação">
                            Automação
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="atributos" value="Biblioteca">
                            Biblioteca
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="atributos" value="Adega">
                            Adega
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="atributos" value="Paisagismo">
                            Paisagismo
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="atributos" value="Segurança 24h">
                            Segurança 24h
                        </label>
                    </div>
                </fieldset>

                <!-- BADGE -->
                <fieldset style="margin-top: 2.5rem;">
                    <legend style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; color: #1a1a1a;">Badge de Destaque</legend>
                    
                    <div class="form-group">
                        <label for="badge">Selecione um badge (opcional)</label>
                        <select id="badge" name="badge" aria-label="Badge de destaque">
                            <option value="">Nenhum</option>
                            <option value="Destaque">Destaque</option>
                            <option value="Novo Lançamento">Novo Lançamento</option>
                            <option value="Premium">Premium</option>
                            <option value="Oferta">Oferta Especial</option>
                            <option value="Promoção">Promoção</option>
                        </select>
                    </div>
                </fieldset>

                <!-- IMAGENS -->
                <fieldset style="margin-top: 2.5rem;">
                    <legend style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; color: #1a1a1a;">Imagens</legend>
                    
                    <div class="form-group">
                        <label for="imagens">URLs das Imagens (uma por linha)</label>
                        <textarea 
                            id="imagens" 
                            name="imagens" 
                            rows="4" 
                            placeholder="img(product)/casa.jpg&#10;img(product)/casa2.jpg&#10;img(product)/casa3.jpg"
                            aria-label="URLs das imagens"
                        ></textarea>
                        <small style="color: #666;">Insira uma URL de imagem por linha</small>
                    </div>
                </fieldset>

                <!-- BOTÕES -->
                <div style="display: flex; gap: 1rem; margin-top: 3rem; justify-content: center; flex-wrap: wrap;">
                    <button type="submit" class="btn btn-primary">Cadastrar Imóvel</button>
                    <button type="reset" class="btn btn-outline">Limpar Formulário</button>
                    <a href="index.html" style="display: inline-block;"><button type="button" class="btn btn-secondary">Voltar</button></a>
                </div>
            </form>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 SA Incorporadora. Todos os direitos reservados.</p>
            <p>Definição de alto padrão | Sua casa dos sonhos</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="js/modules/validacao.js"></script>
    <script src="js/modules/api.js"></script>
    <script>
        $(document).ready(function() {
            // Máscara para CEP
            $('#cep').mask('00000-000');

            // Buscar endereço por CEP
            $('#cep').on('blur', function() {
                const cep = $(this).val();
                if (cep.length === 8 || cep.length === 9) {
                    API.buscarEnderecoPorCEP(cep);
                }
            });

            // Verificar autenticação
            const corretor = JSON.parse(localStorage.getItem('corretor-autenticado'));
            if (!corretor) {
                alert('Você precisa estar logado para cadastrar imóveis.');
                window.location.href = 'login.html';
                return;
            }

            // Enviar formulário
            $('#form-cadastro').on('submit', function(e) {
                e.preventDefault();

                // Coletar atributos
                const atributos = [];
                $('input[name="atributos"]:checked').each(function() {
                    atributos.push($(this).val());
                });

                // Coletar imagens
                const imagensText = $('#imagens').val().trim();
                const imagens = imagensText 
                    ? imagensText.split('\n').map(img => img.trim()).filter(img => img)
                    : ['img(product)/placeholder.jpg'];

                // Validar formulário
                if (!$('#nome').val().trim()) {
                    alert('Por favor, preencha o nome do imóvel.');
                    return;
                }

                if (!$('#endereco').val().trim()) {
                    alert('Por favor, preencha o endereço.');
                    return;
                }

                if (isNaN($('#preco').val()) || $('#preco').val() <= 0) {
                    alert('Por favor, insira um preço válido.');
                    return;
                }

                // Criar objeto de imóvel
                const novoImovel = {
                    id: Date.now(),
                    nome: $('#nome').val(),
                    tipo: $('#tipo').val(),
                    preco: parseInt($('#preco').val()),
                    finalidade: $('#finalidade').val(),
                    suites: parseInt($('#suites').val()) || 0,
                    banheiros: parseInt($('#banheiros').val()) || 0,
                    area: parseInt($('#area').val()) || 0,
                    garagens: parseInt($('#garagens').val()) || 0,
                    cidade: $('#cidade').val(),
                    bairro: $('#bairro').val(),
                    endereco: $('#endereco').val(),
                    cep: $('#cep').val(),
                    descricao: $('#descricao').val(),
                    descricaoCompleta: $('#descricaoCompleta').val() || $('#descricao').val(),
                    imagens: imagens,
                    badge: $('#badge').val() || 'Novo',
                    atributos: atributos.length > 0 ? atributos : ['Padrão']
                };

                // Enviar para API
                API.adicionarImovel(
                    novoImovel,
                    function() {
                        alert('Imóvel cadastrado com sucesso!');
                        $('#form-cadastro')[0].reset();
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    },
                    function(error) {
                        alert('Erro ao cadastrar imóvel: ' + error);
                    }
                );
            });
        });
    </script>
</body>
</html>
